[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spotify-pipeline"
version = "0.1.0"
description = "ELT pipeline that models 18 months of Spotify Global Top 50 snapshots into a tested star schema."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Neha Karamchandani" }]
dependencies = ["duckdb>=1.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
analysis = ["scipy>=1.11", "matplotlib>=3.8"]

[project.scripts]
spotify-pipeline = "spotify_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
